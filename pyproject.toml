[project]
name = "sqlalchemy-persisted-hybrid-property"
version = "1.0.1"
description = "Implementation of SQLAlchemy's @hybrid_property with database persistence."
authors = [{ name = "Matt Coulter" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
sqlmodel = [
    "sqlmodel>=0.0.27,<0.1",
]

[project.urls]
Homepage = "https://github.com/mattcoulter7/sqlalchemy-hybrid-property-persisted"
Documentation = "https://github.com/mattcoulter7/sqlalchemy-hybrid-property-persisted/blob/main/README.md"
Repository = "https://github.com/mattcoulter7/sqlalchemy-hybrid-property-persisted"

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<0.22",
    "alembic>=1.17,<2",
    "greenlet>=3.3,<4",
    "pytest>=8.4.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.12.3,<0.13",
    "pre-commit>=4.2.0,<5",
    "isort>=6.0.1,<7",
    "sqlmodel>=0.0.27,<0.1",
]

[tool.hatch.build.targets.sdist]
include = ["src/sqlalchemy_persisted_hybrid_property"]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_persisted_hybrid_property"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py312"

[tool.uv]
native-tls = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused arguments
    "D",  # pydocstyle (docstring checks)
]
exclude = ["proto",".git","__pycache__",".venv"]
ignore = [
    "D104", # missing docstring in public package
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001", # pytest fixtures/callbacks often require framework-defined signatures
    "D100",   # test modules do not need public API docstrings
    "D103",   # test functions should be named descriptively instead
    "F401",   # regression tests may keep imports for coverage of public importability
]

[tool.pytest.ini_options]
markers = [
  "integration: Assigns the test to the integration test suite.",
  "regression: Assigns the test to the regression test suite"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
